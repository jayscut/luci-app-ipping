name: Build packages

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ "x86_64-23.05.5", "x86_64-24.10.2", "x86_64-25.12.5" ]
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        uses: openwrt/gh-action-sdk@v5
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-ipping
          NO_SHFMT_CHECK: 1
          V: s
          BUILD_LOG: 1

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/packages -type f \( -name "luci-app-ipping*.ipk" -o -name "luci-app-ipping*.apk" \) -exec cp {} out/ \;
          ls -la out/
          test -n "$(find out -type f | head -n1)"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: logs/

      - name: Dump build log tail into job summary
        if: failure()
        run: |
          echo "### Build log tail" >> "$GITHUB_STEP_SUMMARY"
          if [ -d logs ]; then
            find logs -type f | while read -r f; do
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "no logs dir" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
