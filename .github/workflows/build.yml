name: Build packages

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ "x86_64-23.05.5", "x86_64-24.10.2", "x86_64-25.12.5" ]
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build package
        uses: openwrt/gh-action-sdk@v5
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER: ghcr.io/openwrt/sdk
          FEEDNAME: packages_ci
          PACKAGES: luci-app-ipping
          NO_SHFMT_CHECK: 1
          V: s
          BUILD_LOG: 1

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/packages -type f \( -name "luci-app-ipping*.ipk" -o -name "luci-app-ipping*.apk" \) -exec cp {} out/ \;
          ls -la out/
          test -n "$(find out -type f | head -n1)"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: logs/

      - name: Paste build log tail into an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Build failed for **${{ matrix.arch }}** at `${{ github.sha }}`\n';
            const dir = 'logs';
            if (fs.existsSync(dir)) {
              const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap(e =>
                e.isDirectory() ? walk(d + '/' + e.name) : [d + '/' + e.name]);
              for (const f of walk(dir)) {
                const st = fs.statSync(f);
                if (st.size > 0) {
                  const content = fs.readFileSync(f, 'utf8');
                  body += '\n#### ' + f + '\n```\n' + content.slice(-6000) + '\n```\n';
                }
              }
            } else {
              body += '\n(no logs dir found)';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI failure: ${{ matrix.arch }} @ ${{ github.sha }}'.slice(0, 90),
              body: body.slice(0, 60000)
            });

      - name: Dump build log tail into job summary
        if: failure()
        run: |
          echo "### Build log tail" >> "$GITHUB_STEP_SUMMARY"
          if [ -d logs ]; then
            find logs -type f | while read -r f; do
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 120 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "no logs dir" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Paste job logs into an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            let body = 'Job logs for run `' + context.runId + '`\n';
            for (const j of jobs.data.jobs) {
              if (j.conclusion !== 'failure') continue;
              const log = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: j.id
              });
              let text = String(log.data);
              const lines = text.split('\n').filter(l =>
                /error|Error|ERROR|failed|Failed|FAILED|not found|No such|cannot|Cannot/.test(l));
              body += '\n#### ' + j.name + ' (error-ish lines, last 80)\n```\n' +
                lines.slice(-80).join('\n').slice(-20000) + '\n```\n';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ('CI failure: run ' + context.runId).slice(0, 90),
              body: body.slice(0, 60000) || 'no captured errors'
            });

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
